{% extends "base.html" %}{% block content %}<a class="back" href="{{url_for('dashboard')}}">← Dashboard</a><section class="formpanel"><div class="eyebrow">SUPPORT REQUEST</div><h1>Report an issue</h1><p class="muted">Describe the problem. AI can suggest the best category and urgency for review.</p><form method="post" id="issueForm"><label>Issue title</label><input name="title" id="title" required maxlength="120" placeholder="e.g. Network unavailable on second floor"><label>Description</label><textarea name="description" id="description" rows="5" required placeholder="What happened? Who or what is affected?"></textarea><div class="airow"><button type="button" class="secondary" id="aiButton">✦ Suggest with AI</button><span id="aiMessage" class="muted">AI suggestions are optional and must be reviewed.</span></div><div class="suggestion" id="summaryBox" hidden></div><div class="two"><div><label>Category</label><select name="category" id="category">{% for c in ['IT','HR','Facilities','Finance','Operations','Security','Other'] %}<option>{{c}}</option>{% endfor %}</select></div><div><label>Priority</label><select name="priority" id="priority">{% for p in ['Low','Medium','High','Critical'] %}<option {% if p=='Medium' %}selected{% endif %}>{{p}}</option>{% endfor %}</select></div></div><button>Submit issue →</button></form></section><script>
const btn=document.getElementById('aiButton'), msg=document.getElementById('aiMessage');
btn.addEventListener('click',async()=>{const description=document.getElementById('description').value.trim();if(!description){msg.textContent='Enter a description first.';return;}btn.disabled=true;btn.textContent='Analysing…';msg.textContent='Connecting to AI…';try{const r=await fetch('/api/ai-categorize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description})});const data=await r.json();if(!r.ok)throw new Error(data.error||'AI request failed');document.getElementById('category').value=data.category;document.getElementById('priority').value=data.priority;const box=document.getElementById('summaryBox');box.hidden=false;box.textContent='AI summary: '+data.summary;msg.textContent='Suggestions added. Review before submitting.';}catch(e){msg.textContent=e.message;}finally{btn.disabled=false;btn.textContent='✦ Suggest with AI';}});
</script>{% endblock %}
